# Parámetros del pipeline. Decisiones tomadas el 2026-10-03.

[alcance]
# Legislaturas a procesar (romanos). Decisión: solo la XV.
legislaturas = ["XV"]

[bienes_rentas]
# "completo" = cada línea del formulario; "agregados" = solo totales por bloque.
campos = "completo"
# Método de extracción de los PDF: PENDIENTE de decidir tras la exploración de muestras.
metodo_extraccion = ""

[destino]
# sqlite | postgres | sheets | notion. Decisión: sqlite.
tipo = "sqlite"
sqlite_path = "db/rentismo.sqlite"

[descargas]
cache_dir = "data/raw"
user_agent = "rentismo-sistemico/0.1 (+https://github.com/jamm87/rentismo-sistemico)"
min_intervalo_s = 1.0
reintentos = 5
backoff_base_s = 2.0
timeout_s = 60
# El índice de datos abiertos cambia a diario: se vuelve a pedir pasadas estas horas.
ttl_indice_h = 20

[fuentes]
indice_opendata = "https://www.congreso.es/es/opendata/diputados"

[docbienes]
# Ficha de cada diputado: contiene los enlaces /docbienes/leg{n}/... a sus declaraciones.
ficha_url = "https://www.congreso.es/es/busqueda-de-diputados?p_p_id=diputadomodule&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&_diputadomodule_mostrarFicha=true"

[xerraires]
# Fuente externa (OCR Tesseract + revisión manual de terceros). Fijada a un commit
# para que la importación sea reproducible. Licencia: sin fichero LICENSE; el README
# permite el uso libre ("Sentiros libres de cogerlo"). Se cita siempre como fuente.
repo = "xerraires/diputados"
commit = "5ba0b2c1f0748f07fa39ff29bf29796ce017428c"
